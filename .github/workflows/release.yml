name: CLI Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to CLI version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "moveshield-cli") | .version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match moveshield-cli version v$version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --locked --release --package moveshield-cli --target ${{ matrix.target }}
      - name: Package executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir package
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "target/$TARGET/release/moveshield.exe" package/
          else
            cp "target/$TARGET/release/moveshield" package/
          fi
          cp LICENSE LICENSE-MIT LICENSE-APACHE README.md package/
          archive="moveshield-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          tar -czf "$archive" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: moveshield-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "MoveShield $TAG" \
            --notes-file .github/release-notes.md
